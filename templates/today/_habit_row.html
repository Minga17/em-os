<li class="habit-row {% if item.kind == 'build' and item.done %}done{% endif %} {% if item.kind == 'quit' %}quit{% endif %} {% if item.kind == 'build' and item.counts_done and not item.done %}met{% endif %}"
    id="habit-{{ item.id }}">
  {% if item.kind == 'quit' %}
    <span class="quit-days" aria-hidden="true">{{ item.streak }}</span>
  {% else %}
    <form method="post" action="{{ url_for('habits.toggle', habit_id=item.id) }}"
          hx-post="{{ url_for('habits.toggle', habit_id=item.id) }}"
          hx-target="#habit-{{ item.id }}" hx-swap="outerHTML">
      <button class="tick {% if item.counter %}counter{% endif %}"
              aria-label="{% if item.counter %}{{ _('Add one: {name}', name=item.name) }}{% elif item.done %}{{ _('Undo: {name}', name=item.name) }}{% else %}{{ _('Mark done: {name}', name=item.name) }}{% endif %}">
        {%- if item.done and not item.counter %}✓{% elif item.counter %}{{ '✓' if item.done else (item.amount or '+') }}{% endif -%}
      </button>
    </form>
  {% endif %}
  <span class="habit-emoji">{{ item.icon }}</span>
  <span class="habit-text">
    <strong>{{ item.name }}</strong>
    <span class="sub">{% if item.progress %}{{ item.progress }} · {% endif %}{{ item.label }}</span>
  </span>
  {% if item.counter and item.amount %}
    <form method="post" action="{{ url_for('habits.minus', habit_id=item.id) }}"
          hx-post="{{ url_for('habits.minus', habit_id=item.id) }}" hx-target="#habit-{{ item.id }}" hx-swap="outerHTML">
      <button class="link remove" aria-label="{{ _('One less: {name}', name=item.name) }}">−</button>
    </form>
  {% endif %}
</li>
