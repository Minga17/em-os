{% extends "base.html" %}
{% block title %}{{ _("Edit task · EM OS") }}{% endblock %}

{% block content %}
  <div class="card narrow-wide">
    <h1>{{ _("Edit task") }}</h1>
    <form method="post" class="stack">
      <label>{{ _("Title") }}
        <input name="title" required maxlength="200" value="{{ task['title'] }}">
      </label>

      <div class="row">
        <label>{{ _("Status") }}
          <select name="status">
            {% for s in statuses %}
              <option value="{{ s }}" {% if task['status'] == s %}selected{% endif %}>{{ s|name }}</option>
            {% endfor %}
          </select>
        </label>
        <label>{{ _("Priority") }}
          <select name="priority">
            {% for value, label in priorities.items() %}
              <option value="{{ value }}" {% if task['priority']|string == value|string %}selected{% endif %}>{{ _(label) }}</option>
            {% endfor %}
          </select>
        </label>
        <label>{{ _("Due date") }}
          <input name="due_date" type="date" value="{{ task['due_date'] or '' }}">
        </label>
      </div>

      <label>{{ _("Project") }}
        <select name="project_id">
          <option value="">{{ _("No project") }}</option>
          {% for p in projects %}
            <option value="{{ p['id'] }}" {% if task['project_id']|string == p['id']|string %}selected{% endif %}>{{ p['title'] }}</option>
          {% endfor %}
        </select>
      </label>

      <div class="row">
        <label>{{ _("Repeat") }}
          <select name="repeat">
            {% set current = (task['repeat'] or '').split(':')[0] %}
            {% for value, label in repeats.items() %}
              <option value="{{ value }}" {% if value == current %}selected{% endif %}>{{ _(label) }}</option>
            {% endfor %}
          </select>
        </label>
        <label>{{ _("Goal") }}
          <select name="goal_id">
            <option value="">{{ _("No goal") }}</option>
            {% for gl in goals %}
              <option value="{{ gl['id'] }}" {% if task['goal_id']|string == gl['id']|string %}selected{% endif %}>🎯 {{ gl['title'] }}</option>
            {% endfor %}
          </select>
        </label>
      </div>
      <p class="sub">{{ _("Repeating tasks: finish one and the next appears with its new due date.") }}</p>

      <label>{{ _("Notes") }}
        <textarea name="notes" rows="4">{{ task['notes'] or '' }}</textarea>
      </label>

      <div class="row-actions">
        <button>{{ _("Save changes") }}</button>
        <a href="{{ url_for('tasks.index') }}" class="muted">{{ _("Cancel") }}</a>
      </div>
    </form>

    <form method="post" action="{{ url_for('tasks.delete', task_id=task_id) }}" class="danger-zone">
      <button class="danger">{{ _("Delete this task") }}</button>
    </form>
  </div>
{% endblock %}
