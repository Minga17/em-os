<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}EM OS{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <nav>
    <a href="{{ url_for('home') }}" class="brand">EM OS</a>
    {% if g.user %}
      <a href="{{ url_for('checkin.today') }}">Check in</a>
      <a href="{{ url_for('habits.index') }}">Habits</a>
      <a href="{{ url_for('tasks.index') }}">Tasks</a>
      <a href="{{ url_for('projects.index') }}">Projects</a>
      <span class="who">{{ g.user['name'] }}</span>
      <form method="post" action="{{ url_for('auth.logout') }}" class="inline">
        <button class="link">Log out</button>
      </form>
    {% else %}
      <a href="{{ url_for('auth.login') }}">Log in</a>
      <a href="{{ url_for('auth.register') }}">Sign up</a>
    {% endif %}
  </nav>

  <main>
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}
        <div class="flash {{ category }}">{{ message }}</div>
      {% endfor %}
    {% endwith %}

    {% block content %}{% endblock %}
  </main>
</body>
</html>
