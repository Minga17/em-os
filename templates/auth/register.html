{% extends "base.html" %}
{% block title %}{{ _("Sign up · EM OS") }}{% endblock %}

{% block content %}
  <div class="card narrow">
    <h1>{{ _("Create your account") }}</h1>
    <form method="post" class="stack">
      <label>{{ _("Name") }}
        <input name="name" required value="{{ request.form.get('name', '') }}">
      </label>
      <label>{{ _("Email") }}
        <input name="email" type="email" required value="{{ request.form.get('email', '') }}">
      </label>
      <label>{{ _("Password") }}
        <input name="password" type="password" minlength="8" required>
      </label>
            <label>{{ _("Time zone") }}
        <select name="timezone" required>
          {% for tz in timezones %}
            <option value="{{ tz }}" {% if tz == request.form.get('timezone', 'UTC') %}selected{% endif %}>{{ tz.replace('_', ' ') }}</option>
          {% endfor %}
        </select>
      </label>
      <button>{{ _("Sign up") }}</button>
    </form>
    <p class="muted">{{ _("Already have an account?") }} <a href="{{ url_for('auth.login') }}">{{ _("Log in") }}</a></p>
  </div>
{% endblock %}
