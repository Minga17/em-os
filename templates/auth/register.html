{% extends "base.html" %}
{% block title %}Sign up · EM OS{% endblock %}

{% block content %}
  <div class="card narrow">
    <h1>Create your account</h1>
    <form method="post" class="stack">
      <label>Name
        <input name="name" required value="{{ request.form.get('name', '') }}">
      </label>
      <label>Email
        <input name="email" type="email" required value="{{ request.form.get('email', '') }}">
      </label>
      <label>Password
        <input name="password" type="password" minlength="8" required>
      </label>
      <button>Sign up</button>
    </form>
    <p class="muted">Already have an account? <a href="{{ url_for('auth.login') }}">Log in</a></p>
  </div>
{% endblock %}
