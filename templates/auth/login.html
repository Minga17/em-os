{% extends "base.html" %}
{% block title %}Log in · EM OS{% endblock %}

{% block content %}
  <div class="card narrow">
    <h1>Log in</h1>
    <form method="post" class="stack">
      <label>Email
        <input name="email" type="email" required value="{{ request.form.get('email', '') }}">
      </label>
      <label>Password
        <input name="password" type="password" required>
      </label>
      <button>Log in</button>
    </form>
    <p class="muted">New here? <a href="{{ url_for('auth.register') }}">Create an account</a></p>
  </div>
{% endblock %}
