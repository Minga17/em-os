{% extends "base.html" %}
{% block title %}{{ _("Log in · EM OS") }}{% endblock %}

{% block content %}
  <div class="card narrow">
    <h1>{{ _("Log in") }}</h1>
    <form method="post" class="stack">
      <label>{{ _("Email") }}
        <input name="email" type="email" required value="{{ request.form.get('email', '') }}">
      </label>
      <label>{{ _("Password") }}
        <input name="password" type="password" required autocomplete="current-password">
      </label>
      <a href="{{ url_for('auth.forgot') }}" class="forgot-link">{{ _("Forgot password?") }}</a>
      <button>{{ _("Log in") }}</button>
    </form>
    <p class="muted">{{ _("New here?") }} <a href="{{ url_for('auth.register') }}">{{ _("Create an account") }}</a></p>
  </div>
{% endblock %}
