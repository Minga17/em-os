{% extends "base.html" %}
{% block title %}{{ _("Forgot password · EM OS") }}{% endblock %}

{% block content %}
  <div class="card narrow">
    <h1>{{ _("Forgot your password?") }}</h1>
    <p class="muted">{{ _("Type the email you signed up with. We'll send you a link to choose a new password.") }}</p>
    <form method="post" class="stack">
      <label>{{ _("Email") }}
        <input name="email" type="email" required autocomplete="email" autofocus>
      </label>
      <button>{{ _("Send reset link") }}</button>
    </form>
    <p class="muted"><a href="{{ url_for('auth.login') }}">{{ _("← Back to log in") }}</a></p>
  </div>
{% endblock %}
