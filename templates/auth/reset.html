{% extends "base.html" %}
{% block title %}Choose a new password · EM OS{% endblock %}

{% block content %}
  <div class="card narrow">
    <h1>Choose a new password</h1>
    <form method="post" class="stack">
      <label>New password
        <input name="new_password" type="password" minlength="8" required autocomplete="new-password" autofocus>
      </label>
      <label>Confirm new password
        <input name="confirm_password" type="password" minlength="8" required autocomplete="new-password">
      </label>
      <p class="sub">At least 8 characters. Changing it also logs you out on every other device.</p>
      <button>Save new password</button>
    </form>
  </div>
{% endblock %}
