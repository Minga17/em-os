{% extends "base.html" %}
{% block title %}Edit goal · EM OS{% endblock %}

{% block content %}
  <div class="card narrow-wide">
    <h1>Edit goal</h1>
    <form method="post" class="stack">
      <label>Title
        <input name="title" required maxlength="150" value="{{ goal['title'] }}">
      </label>

      <div class="row">
        <label>Life area
          <select name="area_id">
            <option value="">No area</option>
            {% for a in areas %}
              <option value="{{ a['id'] }}" {% if goal['area_id']|string == a['id']|string %}selected{% endif %}>{{ a['icon'] }} {{ a['name'] }}</option>
            {% endfor %}
          </select>
        </label>
        <label>Status
          <select name="status">
            {% for s in statuses %}
              <option value="{{ s }}" {% if goal['status'] == s %}selected{% endif %}>{{ s|capitalize }}</option>
            {% endfor %}
          </select>
        </label>
        <label>Target date
          <input name="target_date" type="date" value="{{ goal['target_date'] or '' }}">
        </label>
      </div>

      <label>Progress % (used when no linked project has tasks yet)
        <input name="progress" type="number" min="0" max="100" step="5" value="{{ goal['progress'] }}">
      </label>

      <label>Why does this matter?
        <textarea name="why" rows="3">{{ goal['why'] or '' }}</textarea>
      </label>

      <div class="row-actions">
        <button>Save changes</button>
        <a href="{{ url_for('goals.index') }}" class="muted">Cancel</a>
      </div>
    </form>

    <form method="post" action="{{ url_for('goals.delete', goal_id=goal_id) }}" class="danger-zone">
      <button class="danger">Delete this goal</button>
      <span class="sub">Linked projects are kept.</span>
    </form>
  </div>
{% endblock %}
