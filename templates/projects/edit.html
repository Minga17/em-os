{% extends "base.html" %}
{% block title %}{{ _("Edit project · EM OS") }}{% endblock %}

{% block content %}
  <div class="card narrow-wide">
    <h1>{{ _("Edit project") }}</h1>
    <form method="post" class="stack">
      <label>{{ _("Title") }}
        <input name="title" required maxlength="120" value="{{ project['title'] }}">
      </label>
      <div class="row">
        <label>{{ _("Status") }}
          <select name="status">
            {% for s in statuses %}
              <option value="{{ s }}" {% if project['status'] == s %}selected{% endif %}>{{ s|name }}</option>
            {% endfor %}
          </select>
        </label>
        <label>{{ _("GitHub link") }}
          <input name="github_url" type="url" value="{{ project['github_url'] or '' }}">
        </label>
      </div>
      <label>{{ _("Goal") }}
        <select name="goal_id">
          <option value="">{{ _("No goal") }}</option>
          {% for gl in goals %}
            <option value="{{ gl['id'] }}" {% if project['goal_id']|string == gl['id']|string %}selected{% endif %}>🎯 {{ gl['title'] }}</option>
          {% endfor %}
        </select>
      </label>
      <label>{{ _("Next action") }}
        <input name="next_action" value="{{ project['next_action'] or '' }}">
      </label>
      <label>{{ _("Description") }}
        <textarea name="description" rows="3">{{ project['description'] or '' }}</textarea>
      </label>
      <div class="row-actions">
        <button>{{ _("Save changes") }}</button>
        <a href="{{ url_for('projects.index') }}" class="muted">{{ _("Cancel") }}</a>
      </div>
    </form>

    <form method="post" action="{{ url_for('projects.delete', project_id=project_id) }}" class="danger-zone">
      <button class="danger">{{ _("Delete this project") }}</button>
      <span class="sub">{{ _("Its tasks are kept, just unassigned.") }}</span>
    </form>
  </div>
{% endblock %}
